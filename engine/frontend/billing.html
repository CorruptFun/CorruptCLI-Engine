<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Analytics | Corrupt Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        organization: { gold: '#D4AF37', lightgold: '#F3E5AB', dark: '#111111', black: '#000000' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Ambient Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-organization-gold/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-organization-gold/5 blur-[120px] rounded-full"></div>
    </div>

    <!-- Navbar -->
    <nav class="border-b border-white/5 bg-black/50 backdrop-blur-md py-5 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-serif text-white tracking-wide"><span class="text-organization-gold">Corrupt</span> Billing</h1>
            <a href="admin.html" class="text-xs text-gray-400 hover:text-organization-gold uppercase tracking-[0.2em] transition-colors duration-300">Back to Dashboard</a>
        </div>
    </nav>

    <div class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-8 py-12 relative z-10">
        
        <!-- Header -->
        <div class="mb-12">
            <h2 class="text-4xl font-serif text-white mb-2 tracking-tight">Revenue Analytics</h2>
            <p class="text-gray-400 font-light text-sm tracking-widest uppercase">Real-time subscription performance engine.</p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12" id="stats-container">
            <!-- Loading Skeletons -->
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
        </div>

        <!-- Details Table -->
        <div class="bg-white/5 border border-white/10 rounded-3xl overflow-hidden shadow-2xl backdrop-blur-md">
            <div class="p-8 border-b border-white/10 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="text-xl font-serif text-white uppercase tracking-wider">Active Subscriptions</h3>
                <div class="relative w-full md:w-64">
                    <input type="text" id="search-subs" placeholder="Search customer..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-sm text-white focus:border-organization-gold outline-none transition-all placeholder-gray-600">
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-500 text-[10px] uppercase tracking-[0.2em] font-bold border-b border-white/5">
                            <th class="p-8">Customer Details</th>
                            <th class="p-8">Plan Interval</th>
                            <th class="p-8 text-center">Status</th>
                            <th class="p-8">Renewal Date</th>
                            <th class="p-8 text-right">Value</th>
                        </tr>
                    </thead>
                    <tbody id="subs-table-body">
                        <!-- JS injection -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Background Decoration -->
    <div class="fixed bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-organization-gold/20 to-transparent opacity-50"></div>

    <script type="module" src="js/billing.js"></script>
</body>
</html>

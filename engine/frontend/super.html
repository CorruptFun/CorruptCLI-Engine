<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrupt Solutions | Super Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        organization: { gold: '#D4AF37', lightgold: '#F3E5AB', dark: '#111111', black: '#000000' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Ambient Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[20%] w-[50%] h-[50%] bg-blue-500/10 blur-[150px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-organization-gold/5 blur-[120px] rounded-full"></div>
    </div>

    <!-- Navbar -->
    <nav class="border-b border-white/5 bg-black/50 backdrop-blur-md py-5 sticky top-0 z-40">
        <div class="max-w-[1600px] mx-auto px-6 lg:px-12 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-organization-gold to-yellow-600 flex items-center justify-center font-bold text-black text-xs">C</div>
                <h1 class="text-xl font-serif text-white tracking-wide">Command Center</h1>
            </div>
            <div class="flex items-center space-x-6">
                <span id="super-admin-email" class="text-xs text-gray-500 font-mono"></span>
                <button id="logout-btn" class="text-[10px] text-gray-400 hover:text-red-400 uppercase tracking-widest transition-colors">Terminate Session</button>
            </div>
        </div>
    </nav>

    <!-- Super Dashboard -->
    <main id="super-dashboard" class="hidden flex-grow max-w-[1600px] mx-auto w-full px-6 lg:px-12 py-12 relative z-10">
        
        <!-- Global Command Bar -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12" id="global-stats">
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
            <div class="bg-white/5 border border-white/10 p-8 rounded-3xl animate-pulse h-32"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Fleet Sidebar -->
            <div class="lg:col-span-3 space-y-6">
                <div class="bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-md">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xs font-bold uppercase tracking-[0.2em] text-gray-500">Fleet Overview</h3>
                        <span id="org-count" class="text-[10px] bg-organization-gold/20 text-organization-gold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="org-list" class="space-y-2 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Orgs injected here -->
                    </div>
                </div>
            </div>

            <!-- Active Intel View -->
            <div class="lg:col-span-9 space-y-8">
                <div id="selected-org-header" class="bg-gradient-to-r from-white/5 to-transparent border border-white/10 rounded-3xl p-8 backdrop-blur-md hidden">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <span id="target-org-slug" class="text-[10px] font-mono text-organization-gold uppercase tracking-widest mb-2 block"></span>
                            <h2 id="target-org-name" class="text-4xl font-serif text-white">Select an Organization</h2>
                        </div>
                        <div class="flex gap-4">
                            <button id="btn-view-admin" class="bg-white text-black px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-organization-gold transition-all">Launch Dashboard</button>
                            <button id="btn-view-billing" class="bg-white/5 border border-white/10 text-white px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Audit Revenue</button>
                        </div>
                    </div>
                </div>

                <div id="org-intel-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
                    <!-- Intel injected here -->
                    <div class="bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-md">
                        <h4 class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-6">Recent Activity</h4>
                        <div id="recent-activity-list" class="space-y-4">
                            <!-- List -->
                        </div>
                    </div>
                    <div class="bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-md">
                        <h4 class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-6">Subscription Mix</h4>
                        <div id="revenue-mix-chart" class="h-48 flex items-center justify-center text-gray-600 text-sm italic">
                            Subscription analytics coming soon...
                        </div>
                    </div>
                </div>

                <div id="no-org-selected" class="bg-white/5 border border-white/10 border-dashed rounded-3xl p-24 text-center">
                    <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h3 class="text-xl font-serif text-gray-400">Target Organization Required</h3>
                    <p class="text-gray-500 text-sm font-light mt-2">Select a tenant from the fleet sidebar to begin synchronization.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Login Screen -->
    <div id="login-screen" class="flex-grow flex items-center justify-center p-6 relative z-10">
        <div class="bg-black/60 backdrop-blur-xl border border-white/10 rounded-3xl p-10 max-w-md w-full shadow-2xl">
            <h2 class="text-3xl font-serif text-white mb-2 text-center italic">Corrupt Command</h2>
            <p class="text-gray-400 text-sm mb-8 text-center font-light">Authenticated Super Admin access only.</p>
            <form id="login-form" class="space-y-6">
                <input type="email" id="login-email" placeholder="YOUR_SUPER_ADMIN_EMAIL" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white focus:border-organization-gold outline-none transition-all">
                <button type="submit" class="w-full py-4 bg-white rounded-full text-black text-sm font-bold tracking-widest uppercase hover:bg-organization-gold transition-all">Initiate Protocol</button>
            </form>
            <p id="login-msg" class="text-xs text-center mt-6 text-gray-500 font-mono"></p>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>

    <script type="module" src="js/super.js"></script>
</body>
</html>
